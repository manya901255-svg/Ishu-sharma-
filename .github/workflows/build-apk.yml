name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore missing; generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or find ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            case "$EXPECTED_APK" in
              *.apk)
                echo "Verified expected APK exists: $EXPECTED_APK"
                ;;
              *)
                echo "Error: $EXPECTED_APK does not have .apk extension."
                exit 1
                ;;
            esac
          else
            echo "Error: Expected APK file not found or empty at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for generated APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TEMP_DIR"

          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME=$(basename "${{ github.repository }}")
          fi
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          REPO_CLEAN=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH (Tag: $TAG_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          TAG_NAME="${{ steps.prepare_asset.outputs.tag_name }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist or is empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset file is not an .apk file: $ASSET_PATH"; exit 1 ;;
          esac

          NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Workflow Run**: #${{ github.run_number }}
          - **Run Attempt**: #${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Notice**: This APK is intended for testing and development purposes. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          echo "Publishing GitHub Release with tag: $TAG_NAME..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

          echo "Release successfully created."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.prepare_asset.outputs.tag_name }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "============================================="
          echo "       DEBUG APK BUILD & PUBLISH SUMMARY     "
          echo "============================================="

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Asset Name: $ASSET_NAME"
            gh release view "$TAG_NAME" || true

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Summary

          - **Build Status**: ✅ Succeeded
          - **Release Status**: ✅ Published to GitHub Releases
          - **Release Tag**: \`$TAG_NAME\`
          - **APK Asset**: \`$ASSET_NAME\`
          - **Actions Artifact**: \`app-debug-apk\` (available under workflow run summary)

          You can download and install the debug APK directly on your Android device from the **Releases** page or from the **Artifacts** section of this GitHub Actions run.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "Note: The debug APK was compiled successfully and is securely uploaded as a GitHub Actions artifact named 'app-debug-apk'."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build & Release Summary

          - **Build Status**: ✅ Succeeded
          - **Actions Artifact**: ✅ Preserved as \`app-debug-apk\`
          - **Release Status**: ⚠️ Publishing encountered an issue or lacked permissions.

          The debug APK is safely preserved as a workflow artifact. You can download \`app-debug-apk\` directly from the **Artifacts** section at the bottom of this workflow run.
          EOF
          fi
